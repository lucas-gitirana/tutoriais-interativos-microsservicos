name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes unitarios
        run: npm test

      - name: Bibliotecas de sistema do VS Code
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libnspr4 libasound2t64 libgbm1 \
            libdrm2 libxkbcommon0 libgtk-3-0t64 libatk1.0-0t64 \
            libatk-bridge2.0-0t64 libcups2t64 libatspi2.0-0t64 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libxshmfence1 libpango-1.0-0 \
            libcairo2 libx11-xcb1

      - name: Testes de integracao (VS Code headless)
        run: xvfb-run -a npm run test:integration

      - name: Empacotar .vsix
        run: npm run package

      - name: Publicar artefato .vsix
        uses: actions/upload-artifact@v4
        with:
          name: extensao-vsix
          path: '*.vsix'
          if-no-files-found: error
