name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes unitarios
        run: npm test

      - name: Testes de integracao (VS Code + xvfb)
        run: xvfb-run -a npm run test:integration

      - name: Empacotar .vsix
        run: npm run package

      - name: Publicar artefato .vsix
        uses: actions/upload-artifact@v4
        with:
          name: extensao-vsix
          path: '*.vsix'
          if-no-files-found: error
